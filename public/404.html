<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 50% -10%, rgba(59, 130, 246, 0.22), transparent 45%),
                radial-gradient(circle at 10% 100%, rgba(96, 165, 250, 0.14), transparent 40%),
                #070707;
        }

        .bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg .dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(96, 165, 250, .18) 1.2px, transparent 1.2px);
            background-size: 26px 26px;
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000, transparent 75%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000, transparent 75%);
        }

        .bg .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            animation: pulse 4s ease-in-out infinite;
        }
        .bg .orb-1 { top: -128px; left: -128px; background: rgba(59, 130, 246, .20); }
        .bg .orb-2 { bottom: -128px; right: -128px; background: rgba(56, 189, 248, .15); animation-delay: -2s; }

        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            text-align: center;
        }

        .number-box {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .number {
            position: relative;
            font-size: clamp(110px, 22vw, 190px);
            line-height: .8;
            font-weight: 900;
            letter-spacing: -.08em;
            background: linear-gradient(to bottom, #fff, rgba(255, 255, 255, .8) 45%, rgba(255, 255, 255, .1));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .number-glow {
            position: absolute;
            inset: 0;
            background: rgba(59, 130, 246, .20);
            filter: blur(60px);
            border-radius: 50%;
        }

        .badge {
            position: absolute;
            top: 10%;
            right: -24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(96, 165, 250, .25);
            background: rgba(59, 130, 246, .15);
            box-shadow: 0 10px 25px rgba(59, 130, 246, .20);
            backdrop-filter: blur(12px);
            animation: float 5s ease-in-out infinite;
        }
        .badge svg { width: 12px; height: 12px; color: #93c5fd; }
        .badge span {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .15em;
            color: rgba(219, 234, 254, .9);
        }

        .label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            margin-bottom: 14px;
            border-radius: 999px;
            border: 1px solid rgba(96, 165, 250, .15);
            background: rgba(96, 165, 250, .06);
            backdrop-filter: blur(12px);
        }
        .label .dot { width: 6px; height: 6px; border-radius: 50%; background: #60a5fa; }
        .label span {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: rgba(96, 165, 250, .6);
        }

        .title {
            font-size: clamp(1.5rem, 5vw, 2.6rem);
            font-weight: 700;
            line-height: 1.2;
        }
        .title .accent {
            background: linear-gradient(to right, #7dd3fc, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            max-width: 32rem;
            margin: 12px auto 0;
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, .45);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: background .2s ease, color .2s ease;
        }
        .btn svg { width: 16px; height: 16px; }

        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #60a5fa; }
        .btn-primary:hover svg { transform: translateX(-4px); }
        .btn-primary svg { transition: transform .2s ease; }

        .btn-ghost {
            border: 1px solid rgba(96, 165, 250, .15);
            background: rgba(96, 165, 250, .05);
            color: rgba(255, 255, 255, .7);
            backdrop-filter: blur(12px);
        }
        .btn-ghost:hover { background: rgba(96, 165, 250, .12); color: #fff; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-8px) rotate(-6deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: .3; transform: scale(1); }
            50% { opacity: .55; transform: scale(1.08); }
        }

        @media (max-width: 480px) {
            .badge { right: -12px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>

<body>

<div class="bg">
    <div class="dots"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<div class="wrap">

    <div class="number-row">
        <div class="number-box">
            <div class="number-glow"></div>
            <div class="number">404</div>

            <div class="badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                </svg>
                <span>Error</span>
            </div>
        </div>
    </div>

    <div class="label">
        <span class="dot"></span>
        <span>Page Not Found</span>
    </div>

    <h1 class="title">
        Looks like you took <span class="accent">a wrong turn.</span>
    </h1>

    <p class="desc">
        The page you're looking for doesn't exist, has been moved, or may no longer be available.
    </p>

    <div class="actions">
        <a href="/" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            Back to Home
        </a>
        <button onclick="history.back()" class="btn btn-ghost">Go Back</button>
    </div>
</div>

</body>
</html>
