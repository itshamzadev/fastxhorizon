[program:fastxhorizon-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /srv/fastxhorizon/backend/current/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/srv/fastxhorizon/backend/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/fastxhorizon-worker.log
stopwaitsecs=3600
