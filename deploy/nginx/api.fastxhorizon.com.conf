# Example only. Replace the root and PHP-FPM socket for the host.
# TLS certificate paths are intentionally omitted.
server {
    listen 80;
    server_name api.fastxhorizon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.fastxhorizon.com;
    root /srv/fastxhorizon/backend/current/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(\.env|composer\.(json|lock)|package(-lock)?\.json|vendor/) {
        deny all;
    }
}
