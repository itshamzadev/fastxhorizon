# Example only. Replace the root with the deployed frontend release path.
# TLS certificate paths are intentionally omitted.
server {
    listen 80;
    server_name www.fastxhorizon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.fastxhorizon.com;
    root /srv/fastxhorizon/frontend/current/dist;
    index index.html;

    # Configure ssl_certificate and ssl_certificate_key through the host panel.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
