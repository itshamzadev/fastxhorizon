apiVersion: apps/v1
kind: Deployment
metadata:
  name: FASTXHORIZON-electronics-frontend-blue
  namespace: FASTXHORIZON-ecommerce
  labels:
    app: FASTXHORIZON-electronics
    component: frontend
    version: blue
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: FASTXHORIZON-electronics
      component: frontend
      version: blue
  template:
    metadata:
      labels:
        app: FASTXHORIZON-electronics
        component: frontend
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: frontend
        image: <DOCKER_REGISTRY>/FASTXHORIZON-electronics-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: FASTXHORIZON-electronics-config
              key: NODE_ENV
        - name: REACT_APP_API_URL
          value: "http://FASTXHORIZON-electronics-backend:5000"
        - name: VERSION
          value: "blue"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
