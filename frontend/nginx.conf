server {
  listen 80;
  server_name fastxhorizon.com;
  return 301 https://www.fastxhorizon.com$request_uri;
}

server {
  listen 80 default_server;
  server_name www.fastxhorizon.com _;
  root /usr/share/nginx/html;
  index index.html;

  # Sitemap and robots are generated/owned by Express. Proxying these exact
  # paths prevents the SPA fallback or an old public/sitemap.xml from winning.
  location = /sitemap.xml {
    proxy_pass https://api.fastxhorizon.com/sitemap.xml;
    proxy_ssl_server_name on;
    proxy_set_header Host api.fastxhorizon.com;
  }

  location = /robots.txt {
    proxy_pass https://api.fastxhorizon.com/robots.txt;
    proxy_ssl_server_name on;
    proxy_set_header Host api.fastxhorizon.com;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
